<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALCHEMIST v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:Inter,Arial,sans-serif}
.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0;font-size:24px}.sub{color:#8d99a8;font-size:13px;margin-top:4px}
.status{display:flex;gap:8px;align-items:center;background:#111820;border:1px solid #202b36;padding:9px 13px;border-radius:12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#35d07f;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111820;border:1px solid #202b36;border-radius:14px;padding:16px}
.label{font-size:12px;color:#8d99a8}.value{font-size:25px;font-weight:700;margin-top:7px}.green{color:#35d07f}.red{color:#ff647c}
.main{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}.title{font-weight:700;margin-bottom:14px}
.chartbox{height:300px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #202b36;white-space:nowrap}th{color:#8d99a8;font-weight:500}
.badge{padding:4px 8px;border-radius:8px;font-size:11px;background:#1a2530}.buy{color:#35d07f}.sell{color:#ff647c}
.section{margin-top:12px}.cex{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #202b36}.online{color:#35d07f}.offline{color:#ff647c}
.footer{text-align:center;color:#687482;font-size:11px;padding:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.value{font-size:20px}.top{align-items:flex-start;gap:10px}.status{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>⚗️ ALCHEMIST v2</h1><div class="sub">Trading Control Dashboard</div></div>
    <div class="status"><span class="dot"></span><span id="botStatus">ONLINE</span></div>
  </div>

  <div class="grid">
    <div class="card"><div class="label">WIN RATE</div><div class="value" id="wr">0%</div></div>
    <div class="card"><div class="label">WINS</div><div class="value green" id="wins">0</div></div>
    <div class="card"><div class="label">LOSSES</div><div class="value red" id="losses">0</div></div>
    <div class="card"><div class="label">NET PNL</div><div class="value" id="pnl">$0.00</div></div>
  </div>

  <div class="main">
    <div class="card">
      <div class="title">📈 Equity / PnL</div>
      <div class="chartbox"><canvas id="pnlChart"></canvas></div>
    </div>
    <div class="card">
      <div class="title">🏦 CEX Monitor</div>
      <div id="cexList"><div class="sub">Loading...</div></div>
      <div class="section"><div class="label">LAST UPDATE</div><div id="updated" class="sub">-</div></div>
    </div>
  </div>

  <div class="card section">
    <div class="title">📜 Recent Trades</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Time</th><th>Pair</th><th>Side</th><th>Status</th></tr></thead>
        <tbody id="trades"><tr><td colspan="4" class="sub">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="footer">ALCHEMIST v2 • Dashboard refresh 10s</div>
</div>

<script>
let chart;
function money(v){return (v>=0?'+':'')+'$'+Number(v||0).toFixed(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function load(){
  try{
    const r=await fetch('/api/stats',{cache:'no-store'});
    const d=await r.json();

    document.getElementById('wr').textContent=(d.win_rate||0)+'%';
    document.getElementById('wins').textContent=d.wins||0;
    document.getElementById('losses').textContent=d.losses||0;

    const pnl=Number(d.net_pnl||0);
    const pe=document.getElementById('pnl');
    pe.textContent=money(pnl);
    pe.className='value '+(pnl>=0?'green':'red');

    const ctx=document.getElementById('pnlChart').getContext('2d');
    if(chart) chart.destroy();
    chart=new Chart(ctx,{
      type:'line',
      data:{labels:d.dates||[],datasets:[{
        label:'Cumulative PnL',data:d.pnl||[],borderWidth:2,tension:.25,
        pointRadius:2,fill:false
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#7f8b99',maxTicksLimit:8},grid:{color:'#202b36'}},
          y:{ticks:{color:'#7f8b99'},grid:{color:'#202b36'}}
        }
      }
    });

    const rows=d.recent||[];
    document.getElementById('trades').innerHTML=rows.length?rows.map(x=>{
      const side=String(x.side||'');
      const status=String(x.status||'');
      return `<tr><td>${esc(x.created_at)}</td><td>${esc(x.symbol)}</td>
      <td class="${side==='BUY'?'buy':'sell'}">${esc(side)}</td>
      <td>${esc(status)}</td></tr>`;
    }).join(''):'<tr><td colspan="4" class="sub">Belum ada trade selesai</td></tr>';

    document.getElementById('updated').textContent=new Date().toLocaleString('id-ID');
  }catch(e){
    document.getElementById('botStatus').textContent='API ERROR';
  }
}
load();setInterval(load,10000);
</script>
</body>
</html>
